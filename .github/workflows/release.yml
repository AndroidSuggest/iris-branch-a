name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Remove Termux AAPT2 override for GitHub Actions
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache --configuration-cache

      - name: Extract Version Name
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "0.1.0")
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/Iris-Gallery-Branch-A-v${APP_VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.APP_VERSION }}
          files: app/build/outputs/apk/release/Iris-Gallery-Branch-A-v${{ env.APP_VERSION }}.apk
          name: Iris Gallery Branch A v${{ env.APP_VERSION }}
          # draft: false
          # prerelease: false
          # generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
